name = "onex"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Set this to the public URL of the ONEX Python origin.
# Prefer `wrangler secret put ONEX_ORIGIN` for production.
ONEX_ORIGIN = "https://YOUR-ONEX-ORIGIN.example.com"

[[d1_databases]]
binding = "ONEX_DB"
database_name = "onex-db"
database_id = "f5c39466-9e2f-4a21-aa00-14be842dc8b5"
